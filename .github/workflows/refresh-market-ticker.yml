name: Refresh TRMM market ticker
on:
  workflow_dispatch:
  schedule:
    - cron: '20 13 * * 1-5'
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download published market series
        run: |
          python - <<'PY'
          import csv, datetime, io, json, re, urllib.request, xml.etree.ElementTree as ET
          from html import unescape
          def get(url):
              req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0 (compatible; TRMM-public-market-data/1.0)','Accept':'text/html,application/xml,text/csv'})
              with urllib.request.urlopen(req,timeout=25) as response:
                  return response.read().decode('utf-8-sig')
          # Read weekly fixed-rate mortgage averages directly from Freddie Mac.
          page=get('https://www.freddiemac.com/pmms/archive')
          clean=re.sub(r'<[^>]+>',' ',page)
          clean=unescape(re.sub(r'\\s+',' ',clean))
          today=datetime.datetime.now(datetime.timezone.utc).date()
          pattern=r'([A-Z][a-z]+\\s+\\d{1,2},\\s+\\d{4})\\s+(?:Average Rates\\s+)?(\\d+\\.\\d+)\\s*%\\s+(\\d+\\.\\d+)\\s*%'
          matches=[]
          for d,a,b in re.findall(pattern,clean):
              date=datetime.datetime.strptime(d,'%B %d, %Y').date()
              if date<=today: matches.append((date,float(a),float(b)))
          if not matches: raise RuntimeError('Could not parse Freddie Mac weekly archive')
          day,r30,r15=max(matches)
          result={'MORTGAGE30US':{'date':day.isoformat(),'value':r30},'MORTGAGE15US':{'date':day.isoformat(),'value':r15}}
          # Read daily Treasury 2-year and 10-year yields from Treasury's public CSV.
          year=str(today.year)
          url=f'https://home.treasury.gov/resource-center/data-chart-center/interest-rates/daily-treasury-rates.csv/{year}/all?type=daily_treasury_yield_curve&field_tdr_date_value={year}&page&_format=csv'
          rows=list(csv.DictReader(io.StringIO(get(url))))
          observations=[]
          for row in rows:
              try:
                  d=datetime.datetime.strptime(row.get('Date',''),'%m/%d/%Y').date()
                  a=float(row['2 Yr'])
                  b=float(row['10 Yr'])
                  if d<=today: observations.append((d,a,b))
              except (ValueError,KeyError,TypeError): continue
          if not observations: raise RuntimeError('No recent Treasury yield observations')
          day,a,b=max(observations)
          result['DGS2']={'date':day.isoformat(),'value':a}
          result['DGS10']={'date':day.isoformat(),'value':b}
          for key,item in result.items():
              age=(today-datetime.date.fromisoformat(item['date'])).days
              if age>(14 if key.startswith('MORTGAGE') else 10): raise RuntimeError(f'Stale published series {key}: {item["date"]}')
          with open('market-ticker.json','w') as output:
              json.dump({'source':'Freddie Mac Primary Mortgage Market Survey / US Treasury','rates':result},output,indent=2)
              output.write('\\n')
          PY
      - name: Publish if values changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add market-ticker.json
          git diff --cached --quiet || (git commit -m "Update published TRMM market ticker data" && git push)
